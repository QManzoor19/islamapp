          <div class="arabic text-xl text-amber-900 mb-1">أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا ٱللَّٰهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ</div>
          <div class="italic text-sm text-amber-700">Ashhadu an lā ilāha illā Allāh, wa-ashhadu anna Muḥammadan ʿabduhu wa-rasūluh</div>
          <div class="text-gray-700 text-sm">I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and messenger.</div>
        </div>
      </div>
      <p class="text-gray-600 text-sm">While saying "lā ilāha illā Allāh," raise your right index finger — pointing to the oneness of God.</p>
    `
  },
  {
    title: "Taslīm — the ending",
    icon: "🕊️",
    position: "🪑",
    body: `
      <p class="text-gray-700 mb-4">At the end of the final tashahhud, turn your head to the right and say:</p>
      <div class="bg-white border-l-4 border-amber-600 p-5 rounded-r-lg mb-3">
        <div class="arabic text-2xl text-amber-900 mb-2">ٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ ٱللَّٰهِ</div>
        <div class="italic text-amber-800">As-salāmu ʿalaykum wa-raḥmatullāh</div>
        <div class="text-gray-700 text-sm">"Peace be upon you, and the mercy of Allah."</div>
      </div>
      <p class="text-gray-700 mb-4">Then turn to the left and say the same. The prayer is complete.</p>
      <div class="bg-gradient-to-r from-amber-100 to-yellow-100 border border-amber-300 rounded-xl p-6 text-center">
        <div class="text-5xl mb-3">🕊️</div>
        <div class="arabic text-2xl text-amber-900 mb-2">ٱلْحَمْدُ لِلَّٰهِ</div>
        <div class="italic text-amber-800 mb-4">Alḥamdulillāh</div>
        <div class="text-gray-700">That is one full prayer.</div>
        <div class="mt-4 text-sm text-gray-600">
          To add rakʿāt 3 and 4 (for Dhuhr, ʿAsr, ʿIshā, and the third of Maghrib): stand back up after the first tashahhud, and recite only Al-Fatiha — no extra surah — then bow, prostrate, etc., exactly like before. Finish with a final tashahhud and taslīm.
        </div>
        <div class="mt-6">
          <a href="index.html" class="text-emerald-800 underline font-semibold text-sm">← Back to curriculum</a>
        </div>
      </div>
    `
  }
];

let currentStep = 0;

const nav = document.getElementById("step-nav");
const container = document.getElementById("step-container");
const stepNum = document.getElementById("step-num");
const stepTotal = document.getElementById("step-total");
const prevBtn = document.getElementById("prev-step");
const nextBtn = document.getElementById("next-step");

stepTotal.textContent = steps.length;

function render() {
  nav.innerHTML = steps.map((s, i) => `
    <button class="step-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-amber-50 ${i === currentStep ? 'active' : ''}" data-i="${i}">
      <span class="mr-2">${s.icon}</span>${s.title}
    </button>
  `).join("");

  container.innerHTML = `
    <article class="article-card shadow-sm p-8">
      <div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100">
        <div class="text-5xl">${steps[currentStep].icon}</div>
        <div>
          <div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Step ${currentStep + 1}</div>
          <h2 class="display text-3xl text-emerald-950 font-semibold">${steps[currentStep].title}</h2>
        </div>
      </div>
      <div>${steps[currentStep].body}</div>
    </article>
  `;

  stepNum.textContent = currentStep + 1;
  prevBtn.disabled = currentStep === 0;
  nextBtn.textContent = currentStep === steps.length - 1 ? "Done" : "Next →";

  nav.querySelectorAll(".step-btn").forEach(b => {
    b.addEventListener("click", () => {
      currentStep = parseInt(b.dataset.i);
      render();
         });
  });
}

const MODULE_ID = "2-3";
const STORAGE_KEY = "islamapp-progress-v1";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function markInProgress() {
  const p = loadProgress();
  if (p[MODULE_ID] !== "done") { p[MODULE_ID] = "inprogress"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
}
function markComplete() {
  const p = loadProgress();
  p[MODULE_ID] = "done";
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

prevBtn.addEventListener("click", () => {
  if (currentStep > 0) { currentStep--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
});
nextBtn.addEventListener("click", () => {
  if (currentStep < steps.length - 1) { currentStep++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else { markComplete(); window.location.href = "index.html"; }
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  else if (e.key === "ArrowRight") nextBtn.click();
});

markInProgress();
render();
</script>

</body>
</html>
