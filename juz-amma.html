      </div>
      <p class="text-gray-700 mb-3">Don't try to memorize them all in one session. Pick one a week. Read each one out loud after every prayer. Focus especially on <strong>Al-Ikhlāṣ</strong> (112) and the two <strong>seekings of refuge</strong> (113-114) — these are recited every night before sleep.</p>
      <p class="text-gray-700 text-sm italic">All 10 are Meccan revelations except for An-Naṣr (110), which came near the end of the Prophet's life.</p>
    `
  },
  { title: "105 · Al-Fīl", icon: "🐘", body: surahCard(surahs[105]) },
  { title: "106 · Quraysh", icon: "🐪", body: surahCard(surahs[106]) },
  { title: "107 · Al-Māʿūn", icon: "🤲", body: surahCard(surahs[107]) },
  { title: "108 · Al-Kawthar", icon: "💧", body: surahCard(surahs[108]) },
  { title: "109 · Al-Kāfirūn", icon: "🛑", body: surahCard(surahs[109]) },
  { title: "110 · An-Naṣr", icon: "🌟", body: surahCard(surahs[110]) },
  { title: "111 · Al-Masad", icon: "🔥", body: surahCard(surahs[111]) },
  { title: "112 · Al-Ikhlāṣ ★", icon: "✨", body: `<p class="text-gray-700 mb-4">If you memorize one surah from this module, make it this one. Reciting it three times equals a third of the Quran in reward, per a famous hadith.</p>${surahCard(surahs[112])}` },
  { title: "113-114 · The two seekings of refuge", icon: "🛡️",
    body: `<p class="text-gray-700 mb-4">The last two surahs are paired — known together as <strong>al-Muʿawwidhatān</strong>, "the two seekings of refuge." The Prophet ﷺ recited them every night before sleep, blowing into his hands and wiping over himself. They are protective in nature.</p>${surahCard(surahs[113])}${surahCard(surahs[114])}` },
  {
    title: "Wrap-up",
    icon: "✨",
    body: `
      <p class="text-gray-700 mb-4">You've seen all ten. Now the work is repetition.</p>
      <div class="bg-white border border-amber-200 rounded-xl p-5 mb-4">
        <div class="text-xs uppercase tracking-widest text-amber-700 font-semibold mb-2">Suggested order of memorization</div>
        <ol class="space-y-1 text-sm text-gray-700 list-decimal list-inside">
          <li><strong>Al-Ikhlāṣ (112)</strong> — start here. Four lines, the heart of Islamic creed.</li>
          <li><strong>Al-Falaq (113)</strong> — five lines, recited every night.</li>
          <li><strong>An-Nās (114)</strong> — six lines, paired with Al-Falaq.</li>
          <li><strong>Al-Kawthar (108)</strong> — three lines, the shortest in the Quran.</li>
          <li><strong>Al-Kāfirūn (109)</strong> — six lines, often recited in Fajr sunnah.</li>
          <li>Then the rest in any order.</li>
        </ol>
      </div>
      <div class="bg-emerald-50/80 border-l-4 border-emerald-700 p-5 rounded-r-lg mb-4">
        <p class="text-emerald-900 text-sm"><strong>The technique:</strong> recite a single verse aloud 10 times in a row. Then add the next verse and recite both 10 times. By verse 5 you'll have the surah. Repeat the next morning. Repeat the next week. It will stick.</p>
      </div>
      <div class="bg-gradient-to-r from-emerald-50 to-amber-50 border border-amber-300 rounded-xl p-6 text-center my-6">
        <div class="arabic text-2xl text-emerald-900 mb-1">وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ</div>
        <div class="text-sm italic text-stone-600 mb-4">"And We have certainly made the Quran easy to remember." — Quran 54:17</div>
        <div class="text-sm text-gray-700">Hit <strong>Finish</strong> to mark this module complete.</div>
        <div class="text-sm text-gray-700 mt-2">Next: <strong>Module 4-3: Ayat al-Kursi</strong>.</div>
      </div>

      </div>
    `
  }
];

let currentStep = 0;
const nav = document.getElementById("step-nav");
const container = document.getElementById("step-container");
const stepNum = document.getElementById("step-num");
const stepTotal = document.getElementById("step-total");
const prevBtn = document.getElementById("prev-step");
const nextBtn = document.getElementById("next-step");
stepTotal.textContent = steps.length;

function render() {
  nav.innerHTML = steps.map((s, i) => `<button class="step-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-amber-50 ${i === currentStep ? 'active' : ''}" data-i="${i}"><span class="mr-2">${s.icon}</span>${s.title}</button>`).join("");
  container.innerHTML = `<article class="article-card shadow-sm p-8"><div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100"><div class="text-5xl">${steps[currentStep].icon}</div><div><div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Step ${currentStep + 1}</div><h2 class="display text-3xl text-emerald-950 font-semibold">${steps[currentStep].title}</h2></div></div><div>${steps[currentStep].body}</div></article>`;
  stepNum.textContent = currentStep + 1; prevBtn.disabled = currentStep === 0;
  nextBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next →";
  nav.querySelectorAll(".step-btn").forEach(b => { b.addEventListener("click", () => { currentStep = parseInt(b.dataset.i); render(); }); });
}

const MODULE_ID = "4-2"; const STORAGE_KEY = "islamapp-progress-v1";
function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function markInProgress() { const p = loadProgress(); if (p[MODULE_ID] !== "done") { p[MODULE_ID] = "inprogress"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } }
function markComplete() { const p = loadProgress(); p[MODULE_ID] = "done"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

prevBtn.addEventListener("click", () => { if (currentStep > 0) { currentStep--; render(); } });
nextBtn.addEventListener("click", () => { if (currentStep < steps.length - 1) { currentStep++; render(); } else { markComplete(); window.location.href = "index.html"; } });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  else if (e.key === "ArrowRight") nextBtn.click();
});

markInProgress(); render();
</script>
