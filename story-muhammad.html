      <p class="text-gray-700 mb-4 text-lg">In the year 570 CE, the Arabian peninsula was a tribal society of merchants, raiders, and poets. Most worshipped idols. Three hundred and sixty stood inside the Kaʿba — the cube-shaped sanctuary in Mecca that Abraham and his son Ishmael had built thousands of years before, originally for the worship of one God.</p>

      <p class="text-gray-700 mb-3">He returned with the profits doubled. Her servant Maysara told her not just about the trading — but about the man's character. Khadīja sent her closest confidante to propose marriage.</p>

          <li>· The <strong>Sunnah</strong> — his teaching, captured later in the hadith collections</li>
          <li>· A <strong>unified Arabia</strong> — for the first time in its history</li>
          <li>· A <strong>community</strong> that would carry the message across three continents within a century</li>
        </ul>
      </div>
      ${v(
        "وَمَآ أَرْسَلْنَٰكَ إِلَّا رَحْمَةً لِّلْعَٰلَمِينَ",
        "Wa-mā arsalnāka illā raḥmatan li-l-ʿālamīn",
        "We have not sent you except as a mercy to all worlds.",
        "Quran 21:107"
      )}
      <p class="text-gray-700 mb-3">In Islam, he is the <strong>Khātam al-Anbiyāʾ</strong> — the Seal of the Prophets. No prophet comes after him. He is the human being Muslims regard as the most beloved of Allah's creation, and whose example shapes everything from how a Muslim prays to how they greet a neighbor.</p>
      <div class="bg-gradient-to-r from-emerald-50 to-amber-50 border border-amber-300 rounded-xl p-6 text-center my-6">
        <div class="arabic text-2xl text-emerald-900 mb-1">صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ</div>
        <div class="text-sm italic text-stone-600">Ṣallā Allāhu ʿalayhi wa-sallam — "May Allah's peace and blessings be upon him."</div>
        <div class="text-xs text-gray-700 mt-3">This is the meaning of the ﷺ symbol said after his name.</div>
      </div>
      <div class="text-center text-sm space-x-4">
        <a href="story-muhammad-deep.html" class="text-emerald-800 underline font-semibold">Deep version →</a>
        <a href="stories.html" class="text-emerald-800 underline font-semibold">All stories</a>
      </div>
    `
  }
];

let currentStep = 0;
const nav = document.getElementById("step-nav");
const container = document.getElementById("step-container");
const stepNum = document.getElementById("step-num");
const stepTotal = document.getElementById("step-total");
const prevBtn = document.getElementById("prev-step");
const nextBtn = document.getElementById("next-step");
stepTotal.textContent = steps.length;

function render() {
  nav.innerHTML = steps.map((s, i) => `<button class="step-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-amber-50 ${i === currentStep ? 'active' : ''}" data-i="${i}"><span class="mr-2">${s.icon}</span>${s.title}</button>`).join("");
  container.innerHTML = `<article class="article-card shadow-sm p-8"><div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100"><div class="text-5xl">${steps[currentStep].icon}</div><div><div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Scene ${currentStep + 1}</div><h2 class="display text-3xl text-emerald-950 font-semibold">${steps[currentStep].title}</h2></div></div><div>${steps[currentStep].body}</div></article>`;
  stepNum.textContent = currentStep + 1; prevBtn.disabled = currentStep === 0;
  nextBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next →";
  nav.querySelectorAll(".step-btn").forEach(b => { b.addEventListener("click", () => { currentStep = parseInt(b.dataset.i); render(); }); });
}

const MODULE_ID = "STORY-Muhammad"; const STORAGE_KEY = "islamapp-progress-v1";
function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function markInProgress() { const p = loadProgress(); if (p[MODULE_ID] !== "done") { p[MODULE_ID] = "inprogress"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } }
function markComplete() { const p = loadProgress(); p[MODULE_ID] = "done"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

prevBtn.addEventListener("click", () => { if (currentStep > 0) { currentStep--; render(); } });
nextBtn.addEventListener("click", () => { if (currentStep < steps.length - 1) { currentStep++; render(); } else { markComplete(); window.location.href = "stories.html"; } });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  else if (e.key === "ArrowRight") nextBtn.click();
});

const isSingleMode = new URLSearchParams(window.location.search).get('single') === '1';
const currentMode = isSingleMode ? 'single' : 'moderate';
document.querySelectorAll('.depth-pill a').forEach(a => a.classList.toggle('active', a.dataset.mode === currentMode));

if (isSingleMode) {
  document.querySelector('aside').style.display = 'none';
  prevBtn.parentElement.style.display = 'none';
  document.querySelector('main').parentElement.style.display = 'block';
  document.querySelector('#step-num').parentElement.style.visibility = 'hidden';

  container.innerHTML = steps.map((s, i) => `
    <article class="article-card shadow-sm p-8 mb-6">
      <div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100">
        <div class="text-5xl">${s.icon}</div>
        <div>
          <div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Scene ${i + 1}</div>
          <h2 class="display text-3xl text-emerald-950 font-semibold">${s.title}</h2>
        </div>
      </div>
      <div>${s.body}</div>
    </article>
  `).join("");
  markInProgress();
} else {
  markInProgress();
  render();
}
</script>

</body>
</html>
