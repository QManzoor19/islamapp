<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Module — IslamApp</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('islamapp-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #faf6ed;
    color: #1c2d20;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(201,169,97,0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(6,78,59,0.06) 0%, transparent 40%);
    background-attachment: fixed;
  }
  .arabic { font-family: 'Amiri', serif; direction: rtl; }
  .display { font-family: 'Cormorant Garamond', serif; }
  .geo-pattern {
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23064e3b' fill-opacity='0.05'%3E%3Cpath d='M30 0l7.5 22.5H60L41.25 37.5l7.5 22.5L30 45l-18.75 15 7.5-22.5L0 22.5h22.5z'/%3E%3C/g%3E%3C/svg%3E");
  }
  .arch-card {
    background: #fff;
    border: 1px solid rgba(201,169,97,0.4);
    border-radius: 30% 30% 12px 12px / 12% 12% 12px 12px;
    box-shadow: 0 25px 50px -20px rgba(6,78,59,0.25);
  }
  .gold-line { height: 1px; background: linear-gradient(to right, transparent, #c9a961, transparent); }
  .btn-primary {
    background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
    color: #faf6ed;
    border: 1px solid #c9a961;
  }
  .btn-primary:hover { background: linear-gradient(135deg, #0f766e 0%, #064e3b 100%); }
  .btn-secondary {
    background: #fff;
    border: 1px solid #c9a961;
    color: #064e3b;
  }
  .btn-secondary:hover { background: #faf6ed; }
  .status-btn.active {
    background: #064e3b;
    color: #faf6ed;
    border-color: #c9a961;
  }
</style>
</head>
<body class="geo-pattern min-h-screen">

<div class="max-w-2xl mx-auto px-5 py-12">

  <nav class="mb-8">
    <a href="index.html" class="text-emerald-900 hover:text-amber-700 text-sm font-semibold">← Curriculum</a>
  </nav>

  <div class="arch-card p-10 text-center">
    <div id="tier-label" class="text-xs uppercase tracking-[0.3em] text-amber-700 font-semibold mb-3"></div>
    <div class="gold-line mb-6 max-w-[120px] mx-auto"></div>

    <div id="module-id" class="display text-sm text-stone-500 mb-2"></div>
    <h1 id="module-title" class="display text-4xl text-emerald-950 font-semibold mb-6 leading-tight"></h1>

    <div class="arabic text-3xl text-emerald-900 mb-4">قَيْدَ التَّحْضِير</div>
    <p class="text-stone-600 italic mb-8">This module is part of the curriculum skeleton. Content is coming soon, inshāʾAllāh.</p>

    <div class="gold-line mb-6 max-w-[120px] mx-auto"></div>

    <div class="mb-3 text-xs uppercase tracking-widest text-amber-700 font-semibold">Mark your progress</div>
    <div class="flex gap-2 justify-center mb-8">
      <button data-status="available" class="status-btn px-4 py-2 text-sm border border-stone-300 rounded-lg hover:border-emerald-700">Not started</button>
      <button data-status="inprogress" class="status-btn px-4 py-2 text-sm border border-stone-300 rounded-lg hover:border-emerald-700">In progress</button>
      <button data-status="done" class="status-btn px-4 py-2 text-sm border border-stone-300 rounded-lg hover:border-emerald-700">Completed</button>
    </div>

    <div class="flex gap-3 justify-center">
      <a href="index.html" class="btn-secondary px-6 py-3 rounded-lg font-semibold text-sm">Back to curriculum</a>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = "islamapp-progress-v1";
const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "";
const title = params.get("title") || "Untitled module";
const tier = params.get("tier") || "";
const tierName = params.get("tierName") || "";

document.getElementById("module-id").textContent = "Module " + id;
document.getElementById("module-title").textContent = title;
document.getElementById("tier-label").textContent = tier ? `Tier ${tier} · ${tierName}` : "";
document.title = title + " — IslamApp";

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

function highlightCurrentStatus() {
  const progress = loadProgress();
  const current = progress[id] || "available";
  document.querySelectorAll(".status-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.status === current);
  });
}

document.querySelectorAll(".status-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const progress = loadProgress();
    const status = btn.dataset.status;
    if (status === "available") delete progress[id];
    else progress[id] = status;
    saveProgress(progress);
    highlightCurrentStatus();
  });
});

highlightCurrentStatus();
</script>

</body>
</html>
