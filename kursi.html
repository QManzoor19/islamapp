<script>
const phrases = [
  {
    n: 1,
    ar: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",

    note: "The opening declaration. Two divine names appear: <em>al-Ḥayy</em> (the eternally living) and <em>al-Qayyūm</em> (the one by whom all else is sustained)."
  },
  {
    n: 2,
    ar: "لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ",

    e: "Neither drowsiness overtakes Him, nor sleep.",

  },
  {
    n: 3,
    ar: "لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ",
    t: "Lahu mā fī s-samāwāti wa-mā fī l-arḍ",
    e: "To Him belongs whatever is in the heavens and whatever is on the earth.",

  },
  {
    n: 4,
    ar: "مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ",
    t: "Man dhā lladhī yashfaʿu ʿindahu illā bi-idhnih",
    e: "Who is there who can intercede with Him except by His permission?",

  },
  {
    n: 5,
    ar: "يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ",
    t: "Yaʿlamu mā bayna aydīhim wa-mā khalfahum wa-lā yuḥīṭūna bi-shayʾin min ʿilmihi illā bi-mā shāʾ",

    note: "God's knowledge is unbounded; ours is what He grants. \"What lies before them\" is often glossed as the future; \"what is behind them\" as the past."
  },
  {
    n: 6,
    ar: "وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ",
    t: "Wasiʿa kursiyyuhu s-samāwāti wa-l-arḍ",
    e: "His Footstool extends over the heavens and the earth,",
    note: "The verse takes its name from this phrase. The <em>kursī</em> (footstool / throne-base) of God encompasses creation. Theologians caution against picturing it literally."
  },
  {
    n: 7,
    ar: "وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
    t: "Wa-lā yaʾūduhu ḥifẓuhumā, wa-huwa l-ʿaliyyu l-ʿaẓīm",
    e: "and the preservation of them does not tire Him. He is the Most High, the Most Great.",

];

const fullArabic = "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ";

const steps = [
  {
    title: "Why this verse?",
    icon: "👑",
    body: `
      <p class="text-gray-700 mb-4 text-lg"><strong>Āyat al-Kursī</strong> — the "Throne Verse" — is widely considered the <strong>greatest single verse in the Quran</strong>. The Prophet ﷺ said so explicitly when asked which verse was greatest.</p>
      <p class="text-gray-700 mb-4">It is verse 255 of the second chapter (Al-Baqara). One long verse — about 50 words — that describes God in His sovereignty: living, sustaining, all-knowing, unsleeping, owning everything, allowing no intercession without His permission.</p>
      <div class="bg-emerald-50/80 border-l-4 border-emerald-700 p-5 rounded-r-lg my-5">
        <p class="text-emerald-900 mb-2"><strong>When it is recited:</strong></p>
        <ul class="text-emerald-900 text-sm space-y-1">
          <li>· After every obligatory prayer</li>
          <li>· Before sleeping</li>
          <li>· When entering the home</li>
          <li>· In situations of distress or fear</li>
        </ul>
      </div>
      <p class="text-gray-700 mb-3">A famous hadith: <em>"Whoever recites Āyat al-Kursī after every obligatory prayer, nothing prevents him from entering Paradise except death."</em> — al-Nasāʾī.</p>
      <p class="text-gray-700 text-sm italic">In this module: see the verse whole, then break it into seven phrases — each a different divine attribute. By the end, you should be able to recite at least the opening lines from memory.</p>
    `
  },
  {
    title: "The full verse",
    icon: "📜",
    body: `
      <p class="text-gray-700 mb-4">Here is the verse complete. Read it aloud once, slowly. We will break it down phrase by phrase next.</p>
      <div class="verse-card">
        <div class="text-center text-xs uppercase tracking-widest text-amber-700 font-semibold mb-3">Quran 2:255</div>
        <div class="arabic text-2xl text-emerald-900 leading-loose text-center mb-4">${fullArabic}</div>
        <div class="border-t border-amber-100 pt-3 italic text-emerald-800 text-sm text-center">
          Allāhu lā ilāha illā huwa l-ḥayyu l-qayyūm. Lā taʾkhudhuhu sinatun wa-lā nawm. Lahu mā fī s-samāwāti wa-mā fī l-arḍ. Man dhā lladhī yashfaʿu ʿindahu illā bi-idhnih. Yaʿlamu mā bayna aydīhim wa-mā khalfahum, wa-lā yuḥīṭūna bi-shayʾin min ʿilmihi illā bi-mā shāʾ. Wasiʿa kursiyyuhu s-samāwāti wa-l-arḍ, wa-lā yaʾūduhu ḥifẓuhumā, wa-huwa l-ʿaliyyu l-ʿaẓīm.
        </div>
      </div>
      <p class="text-gray-700 text-sm italic mt-4">Approx 50 words. Most adult learners memorize it over 2–4 weeks of daily recitation.</p>
    `
  },
  {
    title: "Phrases 1–3 — Allah's nature",
    icon: "✦",
    body: `
      <p class="text-gray-700 mb-4">The first three phrases declare what God <strong>is</strong>.</p>
      ${phrases.slice(0, 3).map(p => `
        <div class="phrase-block">
          <div class="flex items-baseline mb-2"><span class="phrase-num">${p.n}</span><span class="text-xs uppercase tracking-widest text-amber-700 font-semibold">Phrase ${p.n}</span></div>
          <div class="arabic text-2xl text-emerald-900 leading-loose mb-2 text-center">${p.ar}</div>
          <div class="italic text-emerald-800 text-sm text-center mb-2">${p.t}</div>
          <div class="text-gray-800 text-center mb-3">"${p.e}"</div>
          <div class="text-sm text-gray-700 border-t border-amber-100 pt-3">${p.note}</div>
        </div>
      `).join("")}
    `
  },
  {
    title: "Phrases 4–5 — Knowledge & intercession",
    icon: "✦",
    body: `
      <p class="text-gray-700 mb-4">The middle phrases address God's knowledge and the question of intercession.</p>
      ${phrases.slice(3, 5).map(p => `
        <div class="phrase-block">
          <div class="flex items-baseline mb-2"><span class="phrase-num">${p.n}</span><span class="text-xs uppercase tracking-widest text-amber-700 font-semibold">Phrase ${p.n}</span></div>
          <div class="arabic text-2xl text-emerald-900 leading-loose mb-2 text-center">${p.ar}</div>
          <div class="italic text-emerald-800 text-sm text-center mb-2">${p.t}</div>
          <div class="text-gray-800 text-center mb-3">"${p.e}"</div>
          <div class="text-sm text-gray-700 border-t border-amber-100 pt-3">${p.note}</div>
        </div>
      `).join("")}
    `
  },
  {
    title: "Phrases 6–7 — The Throne",
    icon: "✦",
    body: `
      <p class="text-gray-700 mb-4">The closing phrases are where the verse gets its name — and end with two more divine attributes.</p>
      ${phrases.slice(5).map(p => `
        <div class="phrase-block">
          <div class="flex items-baseline mb-2"><span class="phrase-num">${p.n}</span><span class="text-xs uppercase tracking-widest text-amber-700 font-semibold">Phrase ${p.n}</span></div>
          <div class="arabic text-2xl text-emerald-900 leading-loose mb-2 text-center">${p.ar}</div>
          <div class="italic text-emerald-800 text-sm text-center mb-2">${p.t}</div>
          <div class="text-gray-800 text-center mb-3">"${p.e}"</div>
          <div class="text-sm text-gray-700 border-t border-amber-100 pt-3">${p.note}</div>
        </div>

  },
  {
    title: "Memorization drill",
    icon: "🧠",
    body: `
      <p class="text-gray-700 mb-4">Words are hidden — try to recall them. Click any blacked-out word to reveal it.</p>
      <div class="flex gap-2 mb-4">
        <button id="hide-25" class="recite-btn">Hide 25%</button>
        <button id="hide-50" class="recite-btn active">Hide 50%</button>
        <button id="hide-75" class="recite-btn">Hide 75%</button>
        <button id="reveal-all" class="recite-btn">Reveal all</button>
      </div>
      <div class="verse-card">
        <div class="arabic text-2xl text-emerald-900 leading-loose text-center" id="drill-text"></div>
      </div>
      <p class="text-gray-700 text-sm italic mt-4">Focus on the <strong>opening line</strong> first — Allāhu lā ilāha illā huwa l-ḥayyu l-qayyūm — that alone is recited often as a standalone dhikr.</p>
    `,
    isDrill: true
  },
  {
    title: "Wrap-up",
    icon: "✨",
    body: `
      <p class="text-gray-700 mb-4">Āyat al-Kursī is long. Don't be discouraged if it takes weeks. The opening line — <em>Allāhu lā ilāha illā huwa l-ḥayyu l-qayyūm</em> — is the most important; once it sticks, the rest follows.</p>
      <div class="bg-white border border-amber-200 rounded-xl p-5 mb-4">
        <div class="text-xs uppercase tracking-widest text-amber-700 font-semibold mb-2">Suggested practice</div>
        <ul class="space-y-1 text-sm text-gray-700 list-disc list-inside">
          <li>Recite it after every obligatory prayer — that's five reps a day.</li>
          <li>Recite it before sleeping — the Prophet ﷺ said an angel will guard you until morning.</li>
          <li>Listen to a recitation by Mishary al-Afasy or Abdul Basit on YouTube; match your rhythm to theirs.</li>
        </ul>
      </div>
      <div class="bg-gradient-to-r from-emerald-50 to-amber-50 border border-amber-300 rounded-xl p-6 text-center my-6">
        <div class="arabic text-2xl text-emerald-900 mb-1">وَهُوَ الْعَلِيُّ الْعَظِيمُ</div>
        <div class="text-sm italic text-stone-600 mb-4">"He is the Most High, the Most Great."</div>
        <div class="text-sm text-gray-700">Hit <strong>Finish</strong> to mark this module complete.</div>
        <div class="text-sm text-gray-700 mt-2">Next: <strong>Module 4-4: Daily Duas</strong>.</div>
      </div>
      <div class="text-center text-sm">
        <a href="index.html" class="text-emerald-800 underline font-semibold">Back to curriculum →</a>
      </div>
    `
  }
];

let currentStep = 0;
const nav = document.getElementById("step-nav");
const container = document.getElementById("step-container");
const stepNum = document.getElementById("step-num");
const stepTotal = document.getElementById("step-total");
const prevBtn = document.getElementById("prev-step");
const nextBtn = document.getElementById("next-step");
stepTotal.textContent = steps.length;

function renderDrill(percent) {
  const words = fullArabic.split(/\s+/).filter(w => w);
  const hideCount = Math.floor(words.length * percent);
  const indices = new Set();
  while (indices.size < hideCount) { indices.add(Math.floor(Math.random() * words.length)); }
  const html = words.map((w, i) => indices.has(i) ? `<span class="hidden-word">${w}</span>` : w).join(" ");
  document.getElementById("drill-text").innerHTML = html;
  document.querySelectorAll(".hidden-word").forEach(el => {
    el.addEventListener("click", () => el.classList.toggle("revealed"));
  });
}

function setupDrill() {
  renderDrill(0.5);
  document.getElementById("hide-25").addEventListener("click", e => { setActiveBtn(e.target); renderDrill(0.25); });
  document.getElementById("hide-50").addEventListener("click", e => { setActiveBtn(e.target); renderDrill(0.5); });
  document.getElementById("hide-75").addEventListener("click", e => { setActiveBtn(e.target); renderDrill(0.75); });
  document.getElementById("reveal-all").addEventListener("click", e => { setActiveBtn(e.target); renderDrill(0); });
}
function setActiveBtn(btn) {
  document.querySelectorAll(".recite-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function render() {
  nav.innerHTML = steps.map((s, i) => `<button class="step-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-amber-50 ${i === currentStep ? 'active' : ''}" data-i="${i}"><span class="mr-2">${s.icon}</span>${s.title}</button>`).join("");
  container.innerHTML = `<article class="article-card shadow-sm p-8"><div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100"><div class="text-5xl">${steps[currentStep].icon}</div><div><div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Step ${currentStep + 1}</div><h2 class="display text-3xl text-emerald-950 font-semibold">${steps[currentStep].title}</h2></div></div><div>${steps[currentStep].body}</div></article>`;
  stepNum.textContent = currentStep + 1; prevBtn.disabled = currentStep === 0;
  nextBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next →";
  if (steps[currentStep].isDrill) setupDrill();
  nav.querySelectorAll(".step-btn").forEach(b => { b.addEventListener("click", () => { currentStep = parseInt(b.dataset.i); render(); }); });
}

const MODULE_ID = "4-3"; const STORAGE_KEY = "islamapp-progress-v1";
function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function markInProgress() { const p = loadProgress(); if (p[MODULE_ID] !== "done") { p[MODULE_ID] = "inprogress"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } }
function markComplete() { const p = loadProgress(); p[MODULE_ID] = "done"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

prevBtn.addEventListener("click", () => { if (currentStep > 0) { currentStep--; render(); } });
nextBtn.addEventListener("click", () => { if (currentStep < steps.length - 1) { currentStep++; render(); } else { markComplete(); window.location.href = "index.html"; } });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  else if (e.key === "ArrowRight") nextBtn.click();
});

markInProgress(); render();
</script>

</body>
</html>
