<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adam — The First Man — IslamApp</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('islamapp-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
<style>
  body { font-family: 'Inter', sans-serif; background: #faf6ed; color: #1c2d20;
    background-image: radial-gradient(circle at 10% 10%, rgba(201,169,97,0.08) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(6,78,59,0.06) 0%, transparent 40%);
    background-attachment: fixed; }
  .arabic { font-family: 'Amiri', serif; direction: rtl; line-height: 1.9; }
  .display { font-family: 'Cormorant Garamond', serif; }
  .geo-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23064e3b' fill-opacity='0.05'%3E%3Cpath d='M30 0l7.5 22.5H60L41.25 37.5l7.5 22.5L30 45l-18.75 15 7.5-22.5L0 22.5h22.5z'/%3E%3C/g%3E%3C/svg%3E"); }
  .step-btn.active { background: #064e3b; color: #faf6ed; border-color: #c9a961; }
  .gold-line { height: 1px; background: linear-gradient(to right, transparent, #c9a961, transparent); }
  .btn-primary { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); color: #faf6ed; border: 1px solid #c9a961; }
  .btn-primary:hover { background: linear-gradient(135deg, #0f766e 0%, #064e3b 100%); }
  .btn-secondary { background: #fff; border: 1px solid #c9a961; color: #064e3b; }
  .btn-secondary:hover { background: #faf6ed; }
  .article-card { background: #fff; border: 1px solid rgba(201,169,97,0.4); border-radius: 14px 14px 6px 6px; }
  .article-card::before { content: ''; display: block; height: 12px; margin: -1px -1px 0 -1px;
    background: linear-gradient(180deg, rgba(201,169,97,0.25), transparent); border-radius: 14px 14px 0 0; border-bottom: 1px solid rgba(201,169,97,0.25); }
  .verse-quote { background: #fff; border-left: 4px solid #c9a961; padding: 1rem 1.25rem; border-radius: 0 8px 8px 0; margin: 1rem 0; }
  .verse-quote .ar { font-family: 'Amiri', serif; font-size: 1.4rem; color: #064e3b; line-height: 1.9; text-align: center; margin-bottom: 0.5rem; }
  .verse-quote .tr { font-style: italic; color: #047857; font-size: 0.85rem; text-align: center; margin-bottom: 0.4rem; }
  .verse-quote .en { color: #1f2937; font-size: 0.9rem; text-align: center; }
  .verse-quote .ref { display: block; text-align: center; margin-top: 0.5rem; font-size: 0.7rem; color: #a8863f; font-weight: 600; letter-spacing: 0.1em; }
  .depth-pill { display: inline-flex; gap: 4px; padding: 2px; background: rgba(201,169,97,0.15); border-radius: 999px; }
  .depth-pill a { padding: 4px 12px; border-radius: 999px; font-size: 0.7rem; letter-spacing: 0.05em; font-weight: 600; text-decoration: none; color: #a8863f; }
  .depth-pill a.active { background: #064e3b; color: #faf6ed; }
</style>
</head>
<body class="geo-pattern min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-10">

  <nav class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <a href="stories.html" class="text-emerald-900 hover:text-amber-700 text-sm font-semibold">← Stories</a>
    <div class="depth-pill">
      <a href="story-adam.html" data-mode="moderate">Moderate</a>
      <a href="story-adam-deep.html" data-mode="deep">Deep</a>
      <a href="story-adam.html?single=1" data-mode="single">One page</a>
    </div>
    <div class="text-sm text-stone-500"><span id="step-num">1</span> / <span id="step-total">9</span></div>
  </nav>

  <header class="text-center mb-8">
    <div class="gold-line mb-4 max-w-[180px] mx-auto"></div>
    <div class="arabic text-3xl text-emerald-900 mb-2">آدَم</div>
    <h1 class="display text-4xl md:text-5xl text-emerald-950 font-semibold">Adam</h1>
    <div class="text-stone-600 mt-2">The first man, the first prophet</div>
    <div class="gold-line mt-4 max-w-[180px] mx-auto"></div>
  </header>

  <div class="grid md:grid-cols-[220px_1fr] gap-6">
    <aside class="md:sticky md:top-6 md:self-start">
      <div class="article-card p-3 shadow-sm">
        <div class="text-xs uppercase tracking-wider text-amber-700 font-semibold mb-2 px-2">Scenes</div>
        <nav id="step-nav" class="space-y-1"></nav>
      </div>
    </aside>
    <main id="step-container"></main>
  </div>

  <div class="flex justify-between mt-8 gap-4">
    <button id="prev-step" class="btn-secondary flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold disabled:opacity-30 disabled:cursor-not-allowed">← Previous</button>
    <button id="next-step" class="btn-primary flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold">Next →</button>
  </div>

</div>

<script>
function v(ar, tr, en, ref) {
  return `<div class="verse-quote"><div class="ar">${ar}</div><div class="tr">${tr}</div><div class="en">"${en}"</div><span class="ref">${ref}</span></div>`;
}

const steps = [
  {
    title: "Where Adam appears",
    icon: "📜",
    body: `
      <p class="text-gray-700 mb-4 text-lg">Adam — the first human and the first prophet — appears in the Quran <strong>across many surahs, never in one continuous chapter</strong>. The story is told and retold from different angles, each telling adding a different angle.</p>
      <div class="bg-white border border-amber-200 rounded-xl p-5 mb-4">
        <div class="text-xs uppercase tracking-widest text-amber-700 font-semibold mb-2">Main passages</div>
        <ul class="text-sm text-gray-700 space-y-1">
          <li>· <strong>Q 2:30–39</strong> — the decision, naming, prostration, fall, repentance</li>
          <li>· <strong>Q 7:11–27</strong> — the fall in detail, Iblīs's whisper, repentance</li>
          <li>· <strong>Q 15:26–44</strong> — creation from clay, Iblīs's reasoning</li>
          <li>· <strong>Q 17:61–65</strong> — Iblīs swears to mislead</li>
          <li>· <strong>Q 20:115–123</strong> — the forgetting, the descent</li>
          <li>· <strong>Q 38:71–85</strong> — the prostration scene retold</li>
          <li>· <strong>Q 5:27–32</strong> — the two sons (Cain &amp; Abel)</li>
        </ul>
      </div>
      <p class="text-gray-700">Each retelling emphasizes something different. We'll move through the story in narrative order, drawing the key verse from wherever it sits.</p>
    `
  },
  {
    title: "The decision",
    icon: "👑",
    body: `
      <p class="text-gray-700 mb-3">Before humanity exists, Allah announces His intention to the angels: He will place a <em>khalīfa</em> — a vicegerent, a steward — on earth.</p>
      <p class="text-gray-700 mb-3">The angels question: Will You place there one who will spill blood and cause corruption, while we already glorify You? The reply is brief and definitive.</p>
      ${v(
        "إِنِّي أَعْلَمُ مَا لَا تَعْلَمُونَ",
        "Innī aʿlamu mā lā taʿlamūn",
        "I know what you do not know.",
        "Quran 2:30"
      )}
      <p class="text-gray-700 text-sm italic">The angels' question turns out to be partly right — humans <em>have</em> caused much harm. But Allah tells them their picture is incomplete. There is something about humanity they haven't seen yet.</p>
    `
  },
  {
    title: "The teaching of names",
    icon: "📖",
    body: `
      <p class="text-gray-700 mb-3">What the angels couldn't see is revealed in the next scene. Allah teaches Adam <strong>"the names — all of them"</strong>, then asks the angels to name them. They cannot.</p>
      ${v(
        "وَعَلَّمَ آدَمَ الْأَسْمَاءَ كُلَّهَا",
        "Wa-ʿallama Ādama l-asmāʾa kullahā",
        "And He taught Adam the names — all of them.",
        "Quran 2:31"
      )}
      <p class="text-gray-700 mb-3">When the angels admit they have no knowledge except what Allah has given them, Adam tells them the names. The angels see for themselves what kind of creature this new being is — not just powerful, but <strong>capable of language, knowledge, and learning</strong>.</p>
      <p class="text-gray-700 text-sm italic">This is humanity's introduction. Not strength, not size — but the capacity to know.</p>
    `
  },
  {
    title: "The prostration & Iblīs's refusal",
    icon: "🔥",
    body: `
      <p class="text-gray-700 mb-3">Allah commands all the angels to prostrate to Adam — a gesture of honor, not worship. They all comply <strong>except Iblīs</strong>, who refuses.</p>
      ${v(
        "أَنَا خَيْرٌ مِّنْهُ ۖ خَلَقْتَنِي مِن نَّارٍ وَخَلَقْتَهُ مِن طِينٍ",
        "Anā khayrun minhu, khalaqtanī min nārin wa-khalaqtahu min ṭīn",
        "I am better than him. You created me from fire, and You created him from clay.",
        "Quran 7:12"
      )}
      <p class="text-gray-700 mb-3">This is the first sin — and it is <strong>pride</strong>, not lust or greed. Iblīs values his own substance over Allah's command. Cast out, he asks for respite until the Day of Judgment, swearing to mislead Adam's descendants.</p>
      <p class="text-gray-700 text-sm italic">Note: Q 18:50 specifies that Iblīs was actually one of the jinn, present among the angels — not an angel himself. Angels in Islam cannot disobey.</p>
    `
  },
  {
    title: "The Garden",
    icon: "🌳",
    body: `
      <p class="text-gray-700 mb-3">Adam and his wife are placed in the Garden, given everything in abundance, and warned about <strong>one tree</strong>.</p>
      ${v(
        "وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ",
        "Wa-kulā minhā raghadan ḥaythu shiʾtumā wa-lā taqrabā hādhihi sh-shajarah",
        "Eat from it freely, wherever you both wish — but do not approach this tree.",
        "Quran 2:35"
      )}
      <p class="text-gray-700 mb-3">The Quran does not say what tree it was. Wheat, grape, fig — classical commentators guessed, then admitted: God doesn't tell us. The point is the principle, not the species.</p>
      <p class="text-gray-700 text-sm italic">Adam's wife (Ḥawwāʾ / Eve) is not named in the Quran but is named in hadith. Importantly: in Islam, she is not blamed for the fall. They are addressed as <em>"both of you"</em> throughout.</p>
    `
  },
  {
    title: "The fall",
    icon: "🍎",
    body: `
      <p class="text-gray-700 mb-3">Iblīs whispers. He approaches them with a lie tailored to their dignity: this tree leads to immortality and angelic status.</p>
      ${v(
        "مَا نَهَاكُمَا رَبُّكُمَا عَنْ هَٰذِهِ الشَّجَرَةِ إِلَّا أَن تَكُونَا مَلَكَيْنِ أَوْ تَكُونَا مِنَ الْخَالِدِينَ",
        "Mā nahākumā rabbukumā ʿan hādhihi sh-shajarati illā an takūnā malakayni aw takūnā mina l-khālidīn",
        "Your Lord forbade you this tree only because you would become angels, or among the immortals.",
        "Quran 7:20"
      )}
      <p class="text-gray-700 mb-3">They eat. Their nakedness is made apparent to them — a metaphor for shame, vulnerability, the loss of innocence. They begin to cover themselves with leaves of the Garden.</p>
    `
  },
  {
    title: "Repentance",
    icon: "🤲",
    body: `
      <p class="text-gray-700 mb-3">Allah calls out: didn't I forbid you that tree? They do not blame each other or the snake or anyone else. They <strong>own it</strong>.</p>
      ${v(
        "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",
        "Rabbanā ẓalamnā anfusanā wa-in lam taghfir lanā wa-tarḥamnā la-nakūnanna mina l-khāsirīn",
        "Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the lost.",
        "Quran 7:23"
      )}
      <p class="text-gray-700 mb-3">Allah accepts. The <strong>contrast with Iblīs is the point</strong>: both disobeyed. Iblīs argued and persisted. Adam acknowledged and repented. The first was cast away. The second was forgiven.</p>
      <div class="bg-emerald-50/80 border-l-4 border-emerald-700 p-5 rounded-r-lg my-4">
        <p class="text-emerald-900 text-sm"><strong>No "original sin."</strong> In Islam, Adam's mistake was Adam's — not inherited by his descendants. We are born with <em>fiṭra</em>, the natural inclination toward God. Each person answers for their own actions.</p>
      </div>
    `
  },
  {
    title: "The descent &amp; the two sons",
    icon: "🌍",
    body: `
      <p class="text-gray-700 mb-3">Adam and his wife are sent down to earth. Life as we know it begins. They have children — and the very first generation contains the first conflict.</p>
      <p class="text-gray-700 mb-3"><strong>Two sons</strong> (traditionally Qābīl / Cain and Hābīl / Abel) each offer a sacrifice. One is accepted, one is not. The rejected son threatens to kill the other.</p>
      ${v(
        "لَئِن بَسَطتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِبَاسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ ۖ إِنِّي أَخَافُ اللَّهَ رَبَّ الْعَالَمِينَ",
        "Laʾin basaṭta ilayya yadaka li-taqtulanī mā anā bi-bāsiṭin yadiya ilayka li-aqtulak, innī akhāfu Allāha rabba l-ʿālamīn",
        "If you stretch your hand to kill me, I will not stretch mine to kill you. I fear Allah, Lord of all the worlds.",
        "Quran 5:28"
      )}
      <p class="text-gray-700 mb-3">The murder happens anyway. The Quran follows immediately with one of its most-quoted verses:</p>
      ${v(
        "مَن قَتَلَ نَفْسًا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍ فِي الْأَرْضِ فَكَأَنَّمَا قَتَلَ النَّاسَ جَمِيعًا",
        "Man qatala nafsan bi-ghayri nafsin aw fasādin fī l-arḍi fa-kaʾannamā qatala n-nāsa jamīʿā",
        "Whoever kills a soul — unless for a soul, or for corruption in the land — it is as if he had killed all of humanity.",
        "Quran 5:32"
      )}
      <p class="text-gray-700 text-sm italic">A crow then teaches the murderer how to bury his brother. The Quran ends the scene there.</p>
    `
  },
  {
    title: "Themes &amp; lessons",
    icon: "💡",
    body: `
      <p class="text-gray-700 mb-4">A few of the threads the story carries:</p>
      <div class="space-y-3 mb-4">
        <div class="bg-white border border-amber-200 rounded-lg p-4">
          <div class="display font-semibold text-emerald-900 mb-1">Knowledge as the gift</div>
          <p class="text-sm text-gray-700">Adam isn't honored for strength but for what he can <em>learn</em>. Humans are the species defined by language and understanding.</p>
        </div>
        <div class="bg-white border border-amber-200 rounded-lg p-4">
          <div class="display font-semibold text-emerald-900 mb-1">Pride as the original sin</div>
          <p class="text-sm text-gray-700">Iblīs's refusal is rooted in feeling superior. The Quran returns to this theme often — pride is consistently named as the gateway sin.</p>
        </div>
        <div class="bg-white border border-amber-200 rounded-lg p-4">
          <div class="display font-semibold text-emerald-900 mb-1">Owning your mistake</div>
          <p class="text-sm text-gray-700">The model of repentance: don't argue, don't deflect. "We have wronged ourselves." Forgiveness follows.</p>
        </div>
        <div class="bg-white border border-amber-200 rounded-lg p-4">
          <div class="display font-semibold text-emerald-900 mb-1">No inherited guilt</div>
          <p class="text-sm text-gray-700">Adam's error is Adam's, not yours. You are born clean and answer for your own choices.</p>
        </div>
      </div>
      <div class="bg-gradient-to-r from-emerald-50 to-amber-50 border border-amber-300 rounded-xl p-6 text-center my-6">
        <div class="arabic text-2xl text-emerald-900 mb-1">رَبَّنَا ظَلَمْنَا أَنفُسَنَا</div>
        <div class="text-sm italic text-stone-600 mb-3">Rabbanā ẓalamnā anfusanā — "Our Lord, we have wronged ourselves."</div>
        <div class="text-sm text-gray-700">The first prayer of the first repentance. Used by Muslims today in their own.</div>
      </div>
      <div class="text-center text-sm space-x-4">
        <a href="story-adam-deep.html" class="text-emerald-800 underline font-semibold">Deep version of this story →</a>
        <a href="stories.html" class="text-emerald-800 underline font-semibold">Back to stories</a>
      </div>
    `
  }
];

let currentStep = 0;
const nav = document.getElementById("step-nav");
const container = document.getElementById("step-container");
const stepNum = document.getElementById("step-num");
const stepTotal = document.getElementById("step-total");
const prevBtn = document.getElementById("prev-step");
const nextBtn = document.getElementById("next-step");
stepTotal.textContent = steps.length;

function render() {
  nav.innerHTML = steps.map((s, i) => `<button class="step-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-amber-50 ${i === currentStep ? 'active' : ''}" data-i="${i}"><span class="mr-2">${s.icon}</span>${s.title}</button>`).join("");
  container.innerHTML = `<article class="article-card shadow-sm p-8"><div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100"><div class="text-5xl">${steps[currentStep].icon}</div><div><div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Scene ${currentStep + 1}</div><h2 class="display text-3xl text-emerald-950 font-semibold">${steps[currentStep].title}</h2></div></div><div>${steps[currentStep].body}</div></article>`;
  stepNum.textContent = currentStep + 1; prevBtn.disabled = currentStep === 0;
  nextBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next →";
  nav.querySelectorAll(".step-btn").forEach(b => { b.addEventListener("click", () => { currentStep = parseInt(b.dataset.i); render(); }); });
}

const MODULE_ID = "STORY-Adam"; const STORAGE_KEY = "islamapp-progress-v1";
function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function markInProgress() { const p = loadProgress(); if (p[MODULE_ID] !== "done") { p[MODULE_ID] = "inprogress"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } }
function markComplete() { const p = loadProgress(); p[MODULE_ID] = "done"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

prevBtn.addEventListener("click", () => { if (currentStep > 0) { currentStep--; render(); } });
nextBtn.addEventListener("click", () => { if (currentStep < steps.length - 1) { currentStep++; render(); } else { markComplete(); window.location.href = "stories.html"; } });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  else if (e.key === "ArrowRight") nextBtn.click();
});

const isSingleMode = new URLSearchParams(window.location.search).get('single') === '1';
const currentMode = isSingleMode ? 'single' : 'moderate';
document.querySelectorAll('.depth-pill a').forEach(a => a.classList.toggle('active', a.dataset.mode === currentMode));

if (isSingleMode) {
  document.querySelector('aside').style.display = 'none';
  prevBtn.parentElement.style.display = 'none';
  document.querySelector('main').parentElement.style.display = 'block';
  document.querySelector('#step-num').parentElement.style.visibility = 'hidden';

  container.innerHTML = steps.map((s, i) => `
    <article class="article-card shadow-sm p-8 mb-6">
      <div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100">
        <div class="text-5xl">${s.icon}</div>
        <div>
          <div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Scene ${i + 1}</div>
          <h2 class="display text-3xl text-emerald-950 font-semibold">${s.title}</h2>
        </div>
      </div>
      <div>${s.body}</div>
    </article>
  `).join("");
  markInProgress();
} else {
  markInProgress();
  render();
}
</script>

</body>
</html>
