<script>
const letters = [
  { n: 1, ar: "ا", name: "Alif", roman: "ā / a", sound: "long 'aa' as in 'father'", example: "أَب — father" },
  { n: 2, ar: "ب", name: "Bāʾ", roman: "b", sound: "as in 'bat'", example: "بَاب — door" },
  { n: 3, ar: "ت", name: "Tāʾ", roman: "t", sound: "as in 'tea'", example: "تِين — figs" },
  { n: 4, ar: "ث", name: "Thāʾ", roman: "th", sound: "as in 'think'", example: "ثَلَاثَة — three" },
  { n: 5, ar: "ج", name: "Jīm", roman: "j", sound: "as in 'jam'", example: "جَمَل — camel" },
  { n: 6, ar: "ح", name: "Ḥāʾ", roman: "ḥ", sound: "deep h from the throat", example: "حَجّ — pilgrimage", style: "throat" },
  { n: 7, ar: "خ", name: "Khāʾ", roman: "kh", sound: "as in Scottish 'loch'", example: "خُبْز — bread", style: "throat" },
  { n: 8, ar: "د", name: "Dāl", roman: "d", sound: "as in 'door'", example: "دَار — house" },
  { n: 9, ar: "ذ", name: "Dhāl", roman: "dh", sound: "as in 'this'", example: "ذَهَب — gold" },
  { n: 10, ar: "ر", name: "Rāʾ", roman: "r", sound: "rolled, as in Spanish", example: "رَجُل — man" },
  { n: 11, ar: "ز", name: "Zāy", roman: "z", sound: "as in 'zoo'", example: "زَيْت — oil" },
  { n: 12, ar: "س", name: "Sīn", roman: "s", sound: "as in 'sun'", example: "سَلَام — peace" },
  { n: 13, ar: "ش", name: "Shīn", roman: "sh", sound: "as in 'shoe'", example: "شَمْس — sun" },
  { n: 14, ar: "ص", name: "Ṣād", roman: "ṣ", sound: "heavy, emphatic 's'", example: "صَلَاة — prayer", style: "heavy" },
  { n: 15, ar: "ض", name: "Ḍād", roman: "ḍ", sound: "heavy, emphatic 'd'", example: "ضَيْف — guest", style: "heavy" },
  { n: 16, ar: "ط", name: "Ṭāʾ", roman: "ṭ", sound: "heavy, emphatic 't'", example: "طِفْل — child", style: "heavy" },
  { n: 17, ar: "ظ", name: "Ẓāʾ", roman: "ẓ", sound: "heavy, emphatic 'th' (as in 'this')", example: "ظِلّ — shade", style: "heavy" },
  { n: 18, ar: "ع", name: "ʿAyn", roman: "ʿ", sound: "deep throat sound — no English equivalent", example: "عَيْن — eye", style: "throat" },
  { n: 19, ar: "غ", name: "Ghayn", roman: "gh", sound: "gargled 'g' from the throat", example: "غُلَام — boy", style: "throat" },
  { n: 20, ar: "ف", name: "Fāʾ", roman: "f", sound: "as in 'fan'", example: "فِيل — elephant" },
  { n: 21, ar: "ق", name: "Qāf", roman: "q", sound: "deep 'k' from back of throat", example: "قَلْب — heart", style: "throat" },
  { n: 22, ar: "ك", name: "Kāf", roman: "k", sound: "as in 'kite'", example: "كِتَاب — book" },
  { n: 23, ar: "ل", name: "Lām", roman: "l", sound: "as in 'lamp'", example: "لَيْل — night" },
  { n: 24, ar: "م", name: "Mīm", roman: "m", sound: "as in 'mom'", example: "مَاء — water" },
  { n: 25, ar: "ن", name: "Nūn", roman: "n", sound: "as in 'nun'", example: "نُور — light" },
  { n: 26, ar: "ه", name: "Hāʾ", roman: "h", sound: "as in 'hat'", example: "هُدَى — guidance" },
  { n: 27, ar: "و", name: "Wāw", roman: "w / ū", sound: "as in 'water', or long 'oo'", example: "وَرْدَة — rose" },
  { n: 28, ar: "ي", name: "Yāʾ", roman: "y / ī", sound: "as in 'yes', or long 'ee'", example: "يَد — hand" }

const sunLetters = "ت ث د ذ ر ز س ش ص ض ط ظ ل ن".split(" ");
const moonLetters = "ا ب ج ح خ ع غ ف ق ك م ه و ي".split(" ");

const nonConnectors = [
  { ar: "ا", name: "Alif" },
  { ar: "د", name: "Dāl" },
  { ar: "ذ", name: "Dhāl" },
  { ar: "ر", name: "Rāʾ" },
  { ar: "ز", name: "Zāy" },
  { ar: "و", name: "Wāw" }
];

function letterTile(L) {
  return `
    <div class="letter-tile ${L.style || ''}" title="${L.sound}">
      <div class="letter-num">${L.n}</div>
      <div class="letter-glyph">${L.ar}</div>
      <div class="letter-name">${L.name}</div>
      <div class="letter-roman">${L.roman}</div>
    </div>
  `;
}

const steps = [
  {
    title: "Why learn the script?",
    icon: "🔤",
    body: `
      <p class="text-gray-700 mb-4 text-lg">The Quran was revealed in Arabic. Every Muslim, regardless of native language, prays in Arabic. Memorizes in Arabic. Reads the original text in Arabic.</p>
      <p class="text-gray-700 mb-4">You don't need to <em>speak</em> Arabic to be a Muslim — but learning to <strong>read the script</strong> opens up everything else: the Quran, the prayers, the names of God, the calligraphy you'll see in every mosque.</p>
      <div class="bg-emerald-50/80 border-l-4 border-emerald-700 p-5 rounded-r-lg my-5">
        <p class="text-emerald-900 mb-2"><strong>The good news:</strong> Arabic has only <strong>28 letters</strong>, written from <strong>right to left</strong>. The hard parts are the throat sounds (which take practice) and the way letters change shape based on position (the next module).</p>
        <p class="text-emerald-900">Most adult learners read fluently within 4–8 weeks of regular practice.</p>
      </div>
      <p class="text-gray-700 mb-3">In this module: meet all 28 letters, see the patterns that connect them, and learn the small handful of rules that decide how a word starts.</p>
      <p class="text-gray-700 text-sm italic">By the time you finish Tier 3, you'll be reading words.</p>
    `
  },
  {
    title: "All 28 letters",
    icon: "📜",
    body: `
      <p class="text-gray-700 mb-4">Here they are, in the standard order. <strong>Read right to left</strong> — but for English browsing convenience, the grid below is left-to-right.</p>
      <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-7 gap-2 mb-5">
        ${letters.map(letterTile).join("")}
      </div>
      <div class="bg-amber-50/60 border border-amber-200 rounded-lg p-4 text-sm text-stone-700 mb-3">
        <strong class="text-amber-800">Color guide:</strong> Plain tiles are common letters. Gold-tinted are <strong>"heavy" / emphatic</strong> consonants (pronounced with the back of the tongue raised). Red-tinted are <strong>throat sounds</strong> — the trickiest for English speakers.
      </div>
      <p class="text-gray-700 text-sm italic">Hover any letter for a brief sound description. Each row of the grid above is a row of related shapes — you'll start seeing the visual logic next.</p>
    `
  },
  {
    title: "Letters by shape",
    icon: "🎨",
    body: `
      <p class="text-gray-700 mb-4">Many Arabic letters share a basic shape and differ only in the number and position of <strong>dots</strong>. Once you spot the families, the alphabet feels much smaller.</p>
      <div class="space-y-3 mb-4">
        <div class="group-card">
          <div class="display font-semibold text-emerald-900 mb-2">The Bāʾ family</div>
          <div class="flex gap-3 items-baseline mb-2 flex-wrap">
            <span class="letter-glyph">ب</span><span class="letter-glyph">ت</span><span class="letter-glyph">ث</span><span class="letter-glyph">ن</span><span class="letter-glyph">ي</span>
          </div>
          <p class="text-xs text-stone-600">Same boat shape — just different dots. <strong>ب</strong> (1 below), <strong>ت</strong> (2 above), <strong>ث</strong> (3 above), <strong>ن</strong> (1 above, deeper bowl), <strong>ي</strong> (2 below).</p>
        </div>
        <div class="group-card">
          <div class="display font-semibold text-emerald-900 mb-2">The Jīm family</div>
          <div class="flex gap-3 items-baseline mb-2 flex-wrap">
            <span class="letter-glyph">ج</span><span class="letter-glyph">ح</span><span class="letter-glyph">خ</span>
          </div>
          <p class="text-xs text-stone-600">Same hooked shape. <strong>ج</strong> (dot inside), <strong>ح</strong> (no dot), <strong>خ</strong> (dot above).</p>
        </div>
        <div class="group-card">
          <div class="display font-semibold text-emerald-900 mb-2">The Dāl &amp; Rāʾ pairs</div>
          <div class="flex gap-3 items-baseline mb-2 flex-wrap">
            <span class="letter-glyph">د</span><span class="letter-glyph">ذ</span><span class="letter-glyph">ر</span><span class="letter-glyph">ز</span>

          <p class="text-xs text-stone-600"><strong>د</strong>/<strong>ذ</strong> share a shape; <strong>ر</strong>/<strong>ز</strong> share a different one. The dotted version is the heavier "th" / "z" sound.</p>

          <div class="display font-semibold text-emerald-900 mb-2">The Sīn &amp; Ṣād families</div>

            <span class="letter-glyph">س</span><span class="letter-glyph">ش</span><span class="letter-glyph">ص</span><span class="letter-glyph">ض</span>

          <p class="text-xs text-stone-600"><strong>س</strong>/<strong>ش</strong> are sharp 's' sounds (with three dots = sh). <strong>ص</strong>/<strong>ض</strong> are their heavy versions.</p>

        <div class="group-card">

          </div>
          <p class="text-xs text-stone-600">Same shape, distinguished only by the dot above on <strong>غ</strong>.</p>

    `
  },
  {
    title: "Sun &amp; moon letters",
    icon: "☀️",
    body: `
      <p class="text-gray-700 mb-4">Arabic's definite article is <strong>al-</strong> (ٱل) — like English "the." But its pronunciation depends on the next letter.</p>
      <div class="grid sm:grid-cols-2 gap-4 mb-4">
        <div class="bg-white border border-amber-200 rounded-xl p-5">
          <div class="display text-xl font-semibold text-emerald-950 mb-2">☀️ Sun letters</div>

          <div class="text-2xl arabic text-emerald-900 mb-1">${moonLetters.join(" ")}</div>

    `
  },

    icon: "🔗",

    `

  },
  {
    title: "Wrap-up",
    icon: "✨",
    body: `

const quizQuestions = [
  { q: "How many letters are in the Arabic alphabet?", choices: ["26", "28", "30", "33"], answer: 1 },

  { q: "ع (ʿAyn) is…", choices: ["A vowel", "A throat sound with no English equivalent", "Only used in poetry", "Silent"], answer: 1 }
];

let currentStep = 0; let quizScore = 0; let quizAnswered = new Set();
let practiceQuestions = []; let practiceScore = 0; let practiceAnswered = new Set();

const nav = document.getElementById("step-nav");
const container = document.getElementById("step-container");
const stepNum = document.getElementById("step-num");
const stepTotal = document.getElementById("step-total");
const prevBtn = document.getElementById("prev-step");
const nextBtn = document.getElementById("next-step");
stepTotal.textContent = steps.length;

function shuffled(arr) { const a = arr.slice(); for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderPractice() {
  practiceScore = 0; practiceAnswered = new Set();
  practiceQuestions = shuffled(letters).slice(0, 8).map(L => {
    const wrongs = shuffled(letters.filter(x => x.n !== L.n)).slice(0, 3).map(x => x.name);
    const choices = shuffled([L.name, ...wrongs]);
    return { letter: L, choices, answer: choices.indexOf(L.name) };
  });
  const el = document.getElementById("practice");
  if (!el) return;
  el.innerHTML = practiceQuestions.map((q, i) => `
    <div class="mb-5 p-5 bg-white border border-amber-200 rounded-xl">
      <div class="flex items-center gap-4 mb-3">
        <div class="practice-arabic" style="font-size: 3rem;">${q.letter.ar}</div>
        <div class="text-stone-600 text-sm">Letter ${i+1} of 8 — what is its name?</div>
      </div>
      <div class="grid sm:grid-cols-2 gap-2" data-pi="${i}">
        ${q.choices.map((c, ci) => `<button class="choice" data-c="${ci}">${c}</button>`).join("")}
      </div>
    </div>
  `).join("");
  document.getElementById("practice-result").classList.add("hidden");
  el.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => {
      const group = btn.closest("[data-pi]"); const pi = parseInt(group.dataset.pi);
      if (practiceAnswered.has(pi)) return;
      const choice = parseInt(btn.dataset.c); const correct = practiceQuestions[pi].answer;
      practiceAnswered.add(pi);
      group.querySelectorAll(".choice").forEach((b, i) => { b.disabled = true; if (i === correct) b.classList.add("correct"); else if (i === choice) b.classList.add("wrong"); });
      if (choice === correct) practiceScore++;
      if (practiceAnswered.size === 8) {
        const r = document.getElementById("practice-result"); r.classList.remove("hidden");
        const pct = practiceScore / 8;
        let msg, color;
        if (pct === 1) { msg = "Eight for eight."; color = "bg-emerald-100 text-emerald-900"; }
        else if (pct >= 0.5) { msg = `${practiceScore} of 8. Keep at it.`; color = "bg-emerald-100 text-emerald-900"; }
        else { msg = `${practiceScore} of 8. Spend time with the table — these come fast with repetition.`; color = "bg-amber-100 text-amber-900"; }
        r.className = "mt-6 p-5 rounded-xl text-center " + color;
        r.innerHTML = `<div class="text-3xl font-bold mb-1">${practiceScore} / 8</div><div class="text-sm">${msg}</div>`;
      }
    });
  });
  document.getElementById("restart-practice").addEventListener("click", renderPractice);
}

function renderQuiz() {
  const quizEl = document.getElementById("quiz"); if (!quizEl) return;
  quizScore = 0; quizAnswered = new Set();
  quizEl.innerHTML = quizQuestions.map((q, qi) => `
    <div class="mb-5 p-5 bg-white border border-amber-200 rounded-xl">
      <div class="font-semibold text-gray-800 mb-3">${qi + 1}. ${q.q}</div>
      <div class="grid gap-2" data-qindex="${qi}">${q.choices.map((c, ci) => `<button class="choice" data-choice="${ci}">${c}</button>`).join("")}</div>
    </div>`).join("");
  quizEl.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => {
      const group = btn.closest("[data-qindex]"); const qi = parseInt(group.dataset.qindex);
      if (quizAnswered.has(qi)) return;
      const choice = parseInt(btn.dataset.choice); const correct = quizQuestions[qi].answer;
      quizAnswered.add(qi);
      group.querySelectorAll(".choice").forEach((b, i) => { b.disabled = true; if (i === correct) b.classList.add("correct"); else if (i === choice) b.classList.add("wrong"); });
      if (choice === correct) quizScore++;
      if (quizAnswered.size === quizQuestions.length) showResult();
    });
  });
}
function showResult() {
  const r = document.getElementById("quiz-result"); r.classList.remove("hidden");
  const pct = quizScore / quizQuestions.length;
  let msg, color;
  if (pct === 1) { msg = "Perfect."; color = "bg-emerald-100 text-emerald-900"; }
  else if (pct >= 0.6) { msg = "Solid."; color = "bg-emerald-100 text-emerald-900"; }
  else { msg = "Worth another pass."; color = "bg-amber-100 text-amber-900"; }
  r.className = "mt-6 p-6 rounded-xl text-center " + color;
  r.innerHTML = `<div class="text-4xl font-bold mb-2">${quizScore} / ${quizQuestions.length}</div><div>${msg}</div>`;
}

function render() {
  nav.innerHTML = steps.map((s, i) => `<button class="step-btn w-full text-left px-3 py-2 rounded-lg border border-transparent text-sm hover:bg-amber-50 ${i === currentStep ? 'active' : ''}" data-i="${i}"><span class="mr-2">${s.icon}</span>${s.title}</button>`).join("");
  container.innerHTML = `<article class="article-card shadow-sm p-8"><div class="flex items-center gap-4 mb-6 pb-4 border-b border-amber-100"><div class="text-5xl">${steps[currentStep].icon}</div><div><div class="text-xs text-amber-700 font-semibold uppercase tracking-widest">Step ${currentStep + 1}</div><h2 class="display text-3xl text-emerald-950 font-semibold">${steps[currentStep].title}</h2></div></div><div>${steps[currentStep].body}</div></article>`;
  stepNum.textContent = currentStep + 1; prevBtn.disabled = currentStep === 0;
  nextBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next →";
  if (steps[currentStep].isPractice) renderPractice();
  if (steps[currentStep].isQuiz) renderQuiz();
  nav.querySelectorAll(".step-btn").forEach(b => { b.addEventListener("click", () => { currentStep = parseInt(b.dataset.i); render(); }); });
}

const MODULE_ID = "3-1"; const STORAGE_KEY = "islamapp-progress-v1";
function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function markInProgress() { const p = loadProgress(); if (p[MODULE_ID] !== "done") { p[MODULE_ID] = "inprogress"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } }
function markComplete() { const p = loadProgress(); p[MODULE_ID] = "done"; localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

prevBtn.addEventListener("click", () => { if (currentStep > 0) { currentStep--; render(); } });
nextBtn.addEventListener("click", () => { if (currentStep < steps.length - 1) { currentStep++; render(); } else { markComplete(); window.location.href = "index.html"; } });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  else if (e.key === "ArrowRight") nextBtn.click();
});

markInProgress(); render();
</script>

</body>
</html>
